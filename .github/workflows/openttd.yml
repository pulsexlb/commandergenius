name: openttd

on:
  workflow_call:
    inputs:
      AppVersionCode:
        required: false
        type: string
        default: ''
      AppVersionName:
        required: false
        type: string
        default: ''
      OpenttdRef:
        description: 'openttd submodule target tag, leave empty for latest commit of branch 15'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      AppVersionCode:
        description: 'App version code (integer), leave empty to keep AndroidAppSettings.cfg value'
        required: false
        default: ''
      AppVersionName:
        description: 'App version name (string), leave empty to keep AndroidAppSettings.cfg value'
        required: false
        default: ''
      OpenttdRef:
        description: 'openttd submodule target tag (e.g. jgrpp-0.73.0), leave empty for latest commit of branch 15'
        required: false
        default: ''
  push:
    branches:
      - sdl_android
    tags:
      - '*'

jobs:
  build:
    env:
      APP_NAME: openttd
      ARCH_LIST: arm64-v8a
      ANDROID_BUILD_TOOLS: 35.0.0
      NDK_VERSION: 27.2.12479018

    runs-on: ubuntu-latest

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch latest openttd submodule commit
        run: |
          git submodule update --init --depth=1 \
          project/jni/application/${APP_NAME} \
          project/jni/iconv/src
          # Take the newest commit of the openttd source repo (pulsexlb/openttd-android, branch jgrpp-android)
          # instead of the pinned one, or the tag specified by the OpenttdRef input
          OTTD_REMOTE=https://github.com/pulsexlb/openttd-android.git
          if [ -n "${{ inputs.OpenttdRef }}" ]; then
            git -C project/jni/application/${APP_NAME}/src fetch --depth=1 $OTTD_REMOTE "refs/tags/${{ inputs.OpenttdRef }}:refs/tags/${{ inputs.OpenttdRef }}"
            git -C project/jni/application/${APP_NAME}/src checkout "${{ inputs.OpenttdRef }}"
          else
            git -C project/jni/application/${APP_NAME}/src fetch --depth=1 $OTTD_REMOTE jgrpp-android
            git -C project/jni/application/${APP_NAME}/src checkout FETCH_HEAD
          fi

      - name: Symlink the application dir
        run: |
          ln -s ${APP_NAME} project/jni/application/src

      - name: Set architectures and version inputs
        run: |
          sed -i "s/^MultiABI=.*/MultiABI='${ARCH_LIST}'/" project/jni/application/src/AndroidAppSettings.cfg
          if [ -n "${{ inputs.AppVersionCode }}" ]; then
            sed -i "s/^AppVersionCode=.*/AppVersionCode=${{ inputs.AppVersionCode }}/" project/jni/application/src/AndroidAppSettings.cfg
          fi
          if [ -n "${{ inputs.AppVersionName }}" ]; then
            sed -i "s/^AppVersionName=.*/AppVersionName=\"${{ inputs.AppVersionName }}\"/" project/jni/application/src/AndroidAppSettings.cfg
          fi
          grep -E '^(MultiABI|AppVersionCode|AppVersionName)=' project/jni/application/src/AndroidAppSettings.cfg

      - name: Install NDK and accept SDK licenses
        run: |
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Get ICU revision
        id: icu-rev
        run: echo "ICU_REV=`git -C project/jni/iconv/src rev-parse HEAD`::arm64-v8a" >> $GITHUB_ENV

      - name: Copy ICU libraries from cache
        uses: actions/cache@v4
        id: cache-icu
        with:
          key: ${{ env.ICU_REV }}
          path: |
            project/jni/iconv/include
            project/jni/iconv/lib
            project/jni/icuuc/include
            project/jni/icuuc/lib
            project/jni/icuuc/share/icu

      - name: Touch cached ICU timestamps
        if: steps.cache-icu.outputs.cache-hit == 'true'
        run: touch project/jni/iconv/lib/*/* project/jni/icuuc/lib/*/* project/jni/icuuc/share/icu/*/* || true

      - name: Patch Java files and build Boost, ICU, and OpenSSL
        run: |
          export PATH=$ANDROID_NDK_HOME:$PATH
          ./changeAppSettings.sh -a

      - name: Set up Gradle
        working-directory: project
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "proguard.config=proguard.cfg;proguard-local.cfg" >> local.properties

      - name: Build
        run: |
          export PATH=$ANDROID_NDK_HOME:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH
          ./build.sh

      - name: App signing keys
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore.jks || true
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > upload_keystore.jks || true
          find keystore.jks -empty -delete || true
          find upload_keystore.jks -empty -delete || true
        env:
          ANDROID_KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}"
          ANDROID_UPLOAD_KEYSTORE_B64: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}"

      - name: Package
        run: |
          export PATH=$ANDROID_NDK_HOME:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH
          if [ -e keystore.jks ]; then
            export ANDROID_KEYSTORE_FILE=`pwd`/keystore.jks
          fi
          if [ -e upload_keystore.jks ]; then
            export ANDROID_UPLOAD_KEYSTORE_FILE=`pwd`/upload_keystore.jks
          fi
          mkdir -p upload/
          ./sign.sh
          mv *.apk upload/ || true
          ./signBundle.sh
          mv *.aab upload/ || true
        env:
          ANDROID_KEYSTORE_PASS: "${{ secrets.ANDROID_KEYSTORE_PASS }}"
          ANDROID_KEYSTORE_ALIAS: "${{ secrets.ANDROID_KEYSTORE_ALIAS }}"
          ANDROID_UPLOAD_KEYSTORE_PASS: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASS }}"
          ANDROID_UPLOAD_KEYSTORE_ALIAS: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_ALIAS }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: upload
          if-no-files-found: error
